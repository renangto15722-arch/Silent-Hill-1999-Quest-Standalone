plugins {
    id 'com.android.application'
}

// Signing key of this app. Reinstalling with another key means uninstalling,
// and uninstalling deletes Android/data/com.sh1vr.quest (saves, config, disc).
// keystore/ is never committed: keystore/keystore.properties holds
// storeFile/storePassword/keyAlias/keyPassword. Without it the build uses the
// standard Android debug key.
def shKeyProps = new Properties()
def shKeyPropsFile = file("${rootProject.projectDir}/keystore/keystore.properties")
if (shKeyPropsFile.exists()) shKeyPropsFile.withInputStream { shKeyProps.load(it) }
def shKeystore = shKeyProps['storeFile'] ? file("${rootProject.projectDir}/keystore/" + shKeyProps['storeFile']) : null

android {
    namespace 'com.sh1vr.quest'
    compileSdk 36
    ndkVersion '27.1.12297006'

    defaultConfig {
        applicationId 'com.sh1vr.quest'
        minSdk 29
        targetSdk 32
        versionCode 3
        versionName '0.3-quest'

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static',
                          "-DSH_LLVM_NM=${android.ndkDirectory}/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-nm.exe",
                          "-DSH_LLVM_OBJCOPY=${android.ndkDirectory}/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-objcopy.exe"
                targets 'SilentHillPC', 'SDL2', 'OpenAL'
            }
        }
    }

    signingConfigs {
        sh1vr {
            if (shKeystore != null) {
                storeFile shKeystore
                storePassword shKeyProps['storePassword']
                keyAlias shKeyProps['keyAlias']
                keyPassword shKeyProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (shKeystore != null) signingConfig signingConfigs.sh1vr
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=Release'
                }
            }
        }
        debug {
            if (shKeystore != null) signingConfig signingConfigs.sh1vr
            // -O0 cannot hold the headset's frame rate; keep symbols.
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=RelWithDebInfo'
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "${rootProject.projectDir}/native/CMakeLists.txt"
            version '3.31.6'
        }
    }

    sourceSets {
        main {
            // SDLActivity and friends straight from the SDL2 source we link.
            java.srcDirs += "${rootProject.projectDir}/../deps/SDL2/android-project/app/src/main/java"
            // Data the game needs besides the disc, unpacked by GameActivity
            // into /sdcard/SilentHillVR on the first run (see shBundleData).
            assets.srcDirs += "${buildDir}/generated/shassets"
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // Khronos OpenXR loader for Android: prebuilt in src/main/jniLibs (the game dlopens it).

    // DiscImport: discs and HD packs downloaded as .7z / .rar (pure Java).
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'org.tukaani:xz:1.10'              // LZMA / LZMA2 inside .7z
    implementation 'com.github.junrar:junrar:7.5.5'   // RAR up to v4 (no RAR5)
}

// Bundled game data (assets/shdata): the port's own gamedata files and
// controller DB + config.cfg, VR hands and the disc note. Dev layout: game in
// ../silent-hill-decomp, data in ../quest-data; GitHub repo: game at ../..,
// data in ../data.
def shQuestRoot = file("${rootProject.projectDir}/..")
def shGame = file("${shQuestRoot}/silent-hill-decomp/pc_port").exists() ?
             file("${shQuestRoot}/silent-hill-decomp") : file("${shQuestRoot}/..")
def shData = file("${shQuestRoot}/quest-data").exists() ?
             file("${shQuestRoot}/quest-data") : file("${shQuestRoot}/data")

def shBundleData = tasks.register('shBundleData', Sync) {
    into "${buildDir}/generated/shassets/shdata"
    from("${shGame}/pc_port/assets/gamedata") { into 'gamedata' }
    from("${shGame}/pc_port/assets/gamecontrollerdb.txt")
    from(shData)
}
preBuild.dependsOn shBundleData
